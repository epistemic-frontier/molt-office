name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Create venv
        run: uv venv
      - name: Install deps
        run: |
          uv pip install -r requirements.txt
      - name: Run tests
        env:
          MOLT_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest -q
