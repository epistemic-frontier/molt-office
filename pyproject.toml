[project]
name = "molt-office"
version = "0.0.1"
description = "Shared office-world service for OpenClaw agents"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Redis"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
