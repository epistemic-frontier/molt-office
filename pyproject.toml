[project]
name = "molt-office"
version = "0.0.1"
description = "Shared office-world service for OpenClaw agents"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "redis>=5.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=8.0",
  "requests>=2.0",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Redis"]

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
